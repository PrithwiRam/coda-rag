<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACORA – Ask Your Question</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 2rem;
        }
        .container {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-weight: 600;
            margin: 0 0 1rem;
            font-size: 1.8rem;
            text-align: center;
            color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 120px;
            border: none;
            border-radius: 8px;
            padding: 0.8rem;
            resize: vertical;
            font-size: 1rem;
            background: rgba(255,255,255,0.12);
            color: #f0f0f0;
            outline: none;
        }
        textarea::placeholder {
            color: #c0c0c0;
        }
        button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #357ab8;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 1rem;
            white-space: pre-wrap;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #4a90e2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>ACORA – Ask a Question</h1>
        <textarea id="prompt" placeholder="Enter your query here…"></textarea>
        <button id="submitBtn">Get Answer</button>
        <div id="feedback" class="result" style="display:none;"></div>
    </div>
    <script>
        const btn = document.getElementById('submitBtn');
        const promptEl = document.getElementById('prompt');
        const feedback = document.getElementById('feedback');
        btn.addEventListener('click', async () => {
            const prompt = promptEl.value.trim();
            if (!prompt) return;
            feedback.style.display = 'block';
            feedback.innerHTML = '<div class="loader"></div>';
            try {
                const resp = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Request failed');
                let out = `Answer:\n${data.answer}\n\n`; 
                out += `Classification: ${data.classification.label || 'N/A'} (confidence ${data.classification.confidence?.toFixed(2) || '0'})\n`;
                out += `Retrieval calls: ${data.retrieval_calls}\nLatency: ${data.latency_ms?.toFixed(0)} ms`;
                feedback.textContent = out;
            } catch (e) {
                feedback.textContent = 'Error: ' + e.message;
            }
        });
    </script>
</body>
</html>
